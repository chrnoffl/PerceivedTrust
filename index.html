<style>
  .character-list button {
    align-items: center;
  }

  .cast-thumb,
  .cast-portrait {
    position: relative;
    overflow: hidden;
    background: #272625;
    color: var(--paper);
    isolation: isolate;
  }

  .cast-thumb {
    display: grid;
    place-items: center;
    flex: 0 0 44px;
    height: 56px;
    border: 1px solid var(--line);
    font: 1.2rem var(--display);
    letter-spacing: .06em;
  }

  .character-list .active .cast-thumb {
    border-color: #d85954;
  }

  .cast-portrait {
    justify-content: center;
    align-items: center;
    min-height: 370px;
  }

  .cast-portrait .cast-initials {
    color: #b3aea5;
    font: clamp(4rem, 8vw, 7rem)/1 var(--display);
    letter-spacing: .04em;
  }

  .cast-thumb img,
  .cast-portrait img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    filter: grayscale(1);
    z-index: 2;
  }

  .cast-portrait .cast-caption {
    position: absolute;
    inset: auto 0 0;
    z-index: 3;
    padding: 2rem 1.3rem 1rem;
    background: linear-gradient(transparent, rgba(0, 0, 0, .88));
    color: #f0ece4;
    font: .75rem var(--sans);
    letter-spacing: .08em;
  }

  @media (max-width: 760px) {
    .cast-portrait { min-height: 320px; }
  }
</style>

<script>
  (() => {
    const cast = [
      { actor: "Abhi Satoeya", file: "peter.jpg" },
      { actor: "Lakshmi Ananda Kumar", file: "mira.jpg" },
      { actor: "Samiksha", file: "valentine.jpg" },
      { actor: "Sneha Sen", file: "nisha.jpg" },
      { actor: "Samadrita", file: "tara.jpg" },
      { actor: "Charan Raj", file: "patrick.jpg" }
    ];

    const list = document.getElementById("character-list");
    const panel = document.querySelector(".cast-slot");
    panel.classList.add("cast-portrait");

    function addPhoto(holder, member, alt) {
      const image = new Image();
      image.alt = alt;
      // Only show the image once it loads. Missing files leave the initials visible.
      image.addEventListener("load", () => holder.append(image), { once: true });
      image.src = `cast/${member.file}`;
    }

    function initials(name) {
      return name.split(" ").map(word => word[0]).join("");
    }

    function showCharacter(index) {
      const character = characters[index];
      const member = cast[index];

      Array.from(list.children).forEach((tab, i) => {
        const active = i === index;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", String(active));
        tab.tabIndex = active ? 0 : -1;
      });

      const letters = document.createElement("span");
      letters.className = "cast-initials";
      letters.textContent = initials(member.actor);
      letters.setAttribute("aria-hidden", "true");

      const caption = document.createElement("span");
      caption.className = "cast-caption";
      caption.textContent = member.actor;

      // Keep each request attached to its own holder even during rapid tab changes.
      const photo = document.createElement("div");
      panel.replaceChildren(letters, photo, caption);
      addPhoto(photo, member, `${member.actor} as ${character.name}`);

      document.getElementById("character-type").textContent = character.type;
      document.getElementById("character-name").textContent = character.name;
      document.getElementById("character-role").textContent = character.role;
      document.getElementById("character-note").textContent = character.note;
      panel.closest('[role="tabpanel"]').setAttribute("aria-labelledby", `cast-tab-${index}`);
    }

    const profile = panel.closest('[role="tabpanel"]');
    profile.id = "cast-profile";
    list.setAttribute("aria-orientation", "vertical");
    list.replaceChildren();

    characters.forEach((character, index) => {
      const member = cast[index];
      const tab = document.createElement("button");
      tab.type = "button";
      tab.id = `cast-tab-${index}`;
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-controls", profile.id);

      const thumb = document.createElement("div");
      thumb.className = "cast-thumb";
      thumb.setAttribute("aria-hidden", "true");
      thumb.textContent = initials(member.actor);
      addPhoto(thumb, member, "");

      tab.append(thumb, document.createTextNode(character.name));
      tab.addEventListener("click", () => showCharacter(index));
      tab.addEventListener("keydown", event => {
        const last = cast.length - 1;
        const next = {
          ArrowDown: (index + 1) % cast.length,
          ArrowUp: (index + last) % cast.length,
          Home: 0,
          End: last
        }[event.key];

        if (next === undefined) return;
        event.preventDefault();
        showCharacter(next);
        list.children[next].focus();
      });
      list.append(tab);
    });

    showCharacter(0);
  })();
</script>
